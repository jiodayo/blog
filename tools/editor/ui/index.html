<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>ブログエディタ</title>
		<link rel="stylesheet" href="/__editor/style.css" />
	</head>
	<body>
		<header class="topbar">
			<h1>ブログエディタ</h1>
			<div class="topbar-status">
				<span id="save-state" class="pill">—</span>
				<span id="git-state" class="pill" title="未コミットの変更"></span>
			</div>
			<div class="topbar-actions">
				<button id="btn-publish" class="btn btn-primary">公開する</button>
			</div>
		</header>

		<main class="layout">
			<!-- 記事一覧 -->
			<aside class="sidebar">
				<div class="sidebar-head">
					<span>記事</span>
					<button id="btn-new" class="btn btn-small">+ 新規</button>
				</div>
				<ul id="post-list" class="post-list"></ul>
			</aside>

			<!-- 編集 -->
			<section class="editor" id="editor" hidden>
				<div class="meta">
					<label class="field field-wide">
						<span>タイトル</span>
						<input id="f-title" type="text" placeholder="記事のタイトル" />
					</label>
					<label class="field field-wide">
						<span>説明<small>一覧とSNSカードに出る</small></span>
						<input id="f-description" type="text" placeholder="一行の説明" />
					</label>
					<label class="field">
						<span>公開日</span>
						<input id="f-pubDate" type="date" />
					</label>
					<label class="field">
						<span>更新日<small>任意</small></span>
						<input id="f-updatedDate" type="date" />
					</label>
					<label class="field">
						<span>スラッグ<small>URLになる</small></span>
						<input id="f-slug" type="text" placeholder="my-post" />
					</label>
					<label class="field field-check">
						<input id="f-draft" type="checkbox" />
						<span>下書き<small>公開サイトに出さない</small></span>
					</label>
				</div>

				<div class="toolbar" id="toolbar">
					<button data-md="h2" title="見出し">H2</button>
					<button data-md="h3" title="小見出し">H3</button>
					<button data-md="bold" title="太字 (⌘B)"><b>B</b></button>
					<button data-md="italic" title="斜体 (⌘I)"><i>I</i></button>
					<button data-md="link" title="リンク (⌘K)">🔗</button>
					<button data-md="code" title="コードブロック">&lt;/&gt;</button>
					<button data-md="quote" title="引用">❝</button>
					<button data-md="ul" title="箇条書き">•</button>
					<button data-md="ol" title="番号付き">1.</button>
					<span class="toolbar-sep"></span>
					<button id="btn-image" title="画像を追加">🖼 画像</button>
					<span class="toolbar-hint">画像はエディタに貼り付け／ドロップでも入ります</span>
					<span class="toolbar-grow"></span>
					<button id="btn-delete" class="danger" title="この記事を削除">削除</button>
				</div>

				<textarea
					id="f-body"
					class="body"
					spellcheck="false"
					placeholder="ここに本文を Markdown で書きます。&#10;&#10;見出しは ## から。**太字**、`コード`、[リンク](https://example.com) が使えます。"
				></textarea>
			</section>

			<!-- プレビュー -->
			<section class="preview">
				<div class="preview-head">
					<span>プレビュー</span>
					<span id="preview-url" class="preview-url"></span>
					<button id="btn-reload" class="btn btn-small">更新</button>
				</div>
				<div class="preview-body">
					<iframe id="preview-frame" title="プレビュー"></iframe>
					<div id="preview-empty" class="preview-empty">
						記事を選ぶとここに表示されます
					</div>
				</div>
			</section>
		</main>

		<!-- 空状態 -->
		<div id="empty-state" class="empty-state" hidden>
			<p>左の「+ 新規」から記事を作れます。</p>
		</div>

		<!-- ログ表示 -->
		<div id="modal" class="modal" hidden>
			<div class="modal-box">
				<h2 id="modal-title">公開</h2>
				<pre id="modal-log"></pre>
				<div class="modal-actions">
					<button id="modal-close" class="btn">閉じる</button>
				</div>
			</div>
		</div>

		<input id="file-input" type="file" accept="image/*" hidden />
		<script type="module" src="/__editor/app.js"></script>
	</body>
</html>

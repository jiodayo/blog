name: Deploy to GitHub Pages

on:
  # main ブランチに push したら公開
  push:
    branches: [main]
  # Actions 画面から手動実行もできるようにしておく
  workflow_dispatch:

# GitHub Pages への公開に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開中に次の公開が走らないようにする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
